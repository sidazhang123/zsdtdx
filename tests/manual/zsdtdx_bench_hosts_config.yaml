# zsdtdx 对比基准专用配置：用户指定行情地址 + 京沪深范围
client:
  preconnect_on_enter: true

hosts:
  standard:
    - "81.70.151.186:7709"
    - "82.156.214.79:7709"
    - "49.232.15.141:7709"
    - "82.156.174.84:7709"
    - "101.42.164.241:7709"
  extended:
    - "112.74.214.43:7727"
    - "175.24.47.69:7727"

pool:
  connect_timeout: 5
  probe_timeout: 2.0

parallel:
  process_count_core_multiplier: 5
  parallel_total_timeout_seconds: 300
  parallel_result_timeout_seconds: 600
  force_recycle_on_timeout: true
  timeout_fallback_to_serial: true
  task_chunk_cache_min_tasks: 2
  task_chunk_inproc_coroutine_workers: 3
  task_chunk_max_inflight_multiplier: 2
  chunk_reconnect_on_unavailable: true
  chunk_timeout_seconds: 60
  chunk_retry_max_attempts: 2
  bundle_watchdog_grace_seconds: 60
  auto_prewarm_on_async: false
  auto_prewarm_require_all_workers: false
  auto_prewarm_timeout_seconds: 120
  auto_prewarm_max_rounds: 3

pagination:
  standard_security_list_page_size: 800
  extended_instrument_info_page_size: 800
  standard_kline_page_size: 800
  standard_kline_qfq: true
  extended_kline_page_size: 700
  company_info_chunk_size: 30000
  max_kline_pages: 400

market_rules:
  include_beijing_prefixes:
    - "92"
  include_hk_market_names:
    - "香港主板"
  stock_prefix_sz:
    - "000"
    - "001"
    - "002"
    - "003"
    - "300"
    - "301"
    - "302"
  stock_prefix_sh:
    - "600"
    - "601"
    - "603"
    - "605"
    - "688"
    - "689"
  future_market_names:
    - "郑州商品"
    - "大连商品"
    - "上海期货"
    - "广州期货"

stock_scope:
  defaults_when_codes_none:
    get_stock_code_name:
      - "szsh"
      - "bj"
    get_stock_latest_price:
      - "szsh"
      - "bj"
    get_stock_kline:
      - "szsh"
      - "bj"

output:
  return_df_default: true
  default_batch_size: 100
  latest_quote_batch_size: 80
  filter_suspended_placeholder_bar: true
  suspended_placeholder_eps: 1.0e-20

index_kline:
  prefer_ex_markets:
    - 62
  route_cache:
    enabled: true
    refresh_granularity: day
    path: ""
  aliases:
    上证综指: 上证指数
  lookup:
    max_candidates: 10
    normalize_whitespace: true
